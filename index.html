<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MBTA Live Map</title>

  <!-- PWA manifest & SW (you already added these) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root{
      --maroon:#800000; --navy:#1F3B73; --muted:#666;
      --green:#2ecc71; --red:#e74c3c; --orange:#e67e22; --blue:#3498db; --purple:#8e44ad; --teal:#16a085; --bus:#555;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0}
    header{padding:12px 16px;border-bottom:1px solid #eee}
    h1{margin:0;color:var(--maroon);font-size:20px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .controls input,.controls select,.controls button,.controls label{padding:8px}
    #layout{display:grid;grid-template-columns: 1fr 340px; gap:0}
    #map{height:78vh;width:100%}
    #status{padding:8px 16px;font-size:13px;color:#555;border-top:1px solid #eee}
    aside{border-left:1px solid #eee; display:flex; flex-direction:column; height:calc(78vh); overflow:auto}
    .panel{padding:12px 12px}
    .panel h3{margin:0 0 8px 0; color:var(--navy); font-size:16px}
    .legend-item{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px;color:#333}
    .dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.4)}
    .dot.green{background:var(--green)} .dot.red{background:var(--red)}
    .dot.orange{background:var(--orange)} .dot.blue{background:var(--blue)}
    .dot.purple{background:var(--purple)} .dot.teal{background:var(--teal)}
    .dot.bus{background:var(--bus)}
    .modes{display:flex;flex-wrap:wrap;gap:10px}
    .modes label{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid #ddd;border-radius:8px}
    .alert{border:1px solid #eee;border-left:4px solid var(--navy);padding:8px 10px;border-radius:6px;margin:8px 0;background:#fafafa}
    .alert small{display:block;color:var(--muted)}
    .inline{display:flex;align-items:center;gap:6px}
    @media (max-width: 900px){
      #layout{grid-template-columns:1fr}
      aside{order:-1;height:auto}
      #map{height:60vh}
    }
  </style>
</head>
<body>
  <header>
    <h1>MBTA Live Map</h1>
    <div class="controls">
      <input id="apiKey" type="text" placeholder="MBTA API Key (optional)">
      <button id="saveKey">Save Key</button>

      <!-- manual text route (optional) -->
      <input id="routeInput" type="text" size="12" placeholder="Route (e.g. 1, Red, Green-B)">

      <!-- auto-populated list of all MBTA routes -->
      <select id="routeList">
        <option value="">-- All Routes --</option>
      </select>

      <select id="refreshMs">
        <option value="5000">Refresh: 5s</option>
        <option value="10000" selected>Refresh: 10s</option>
        <option value="15000">Refresh: 15s</option>
        <option value="30000">Refresh: 30s</option>
      </select>

      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="fitBtn">Fit to Vehicles</button>
    </div>
  </header>

  <div id="layout">
    <div id="map"></div>

    <aside>
      <div class="panel">
        <h3 class="inline">Mode Filters</h3>
        <div class="modes">
          <label><input type="checkbox" class="mode" value="0" checked> Light Rail (Green/Mattapan)</label>
          <label><input type="checkbox" class="mode" value="1" checked> Heavy Rail (Red/Orange/Blue)</label>
          <label><input type="checkbox" class="mode" value="3" checked> Bus</label>
          <label><input type="checkbox" class="mode" value="2" checked> Commuter Rail</label>
          <label><input type="checkbox" class="mode" value="4" checked> Ferry</label>
        </div>
      </div>

      <div class="panel">
        <h3>Legend</h3>
        <div class="legend-item"><span class="dot green"></span> Green Line / Mattapan</div>
        <div class="legend-item"><span class="dot red"></span> Red Line</div>
        <div class="legend-item"><span class="dot orange"></span> Orange Line</div>
        <div class="legend-item"><span class="dot blue"></span> Blue Line</div>
        <div class="legend-item"><span class="dot purple"></span> Commuter Rail</div>
        <div class="legend-item"><span class="dot teal"></span> Ferry</div>
        <div class="legend-item"><span class="dot bus"></span> Bus</div>
      </div>

      <div class="panel">
        <h3>Alerts</h3>
        <div id="alerts">Loading…</div>
      </div>
    </aside>
  </div>

  <div id="status">Idle.</div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="app.js"></script>
</body>
</html>
