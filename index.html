<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MBTA Live Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="styles.css"/>
  <style>
    body{font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0}
    header{padding:12px 16px; border-bottom:1px solid #eee}
    h1{margin:0; color:#800000; font-size:20px}
    .controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
    .controls input,.controls select,.controls button{padding:8px}
    #map{height:75vh; width:100%;}
    #status{padding:8px 16px; font-size:13px; color:#555}
  </style>
</head>
<body>
  <header>
    <h1>MBTA Live Map</h1>
    <div class="controls">
      <input id="apiKey" type="text" placeholder="MBTA API Key (optional)">
      <button id="saveKey">Save Key</button>

      <input id="routeInput" type="text" size="12" placeholder="Route (e.g. 1, Red, Green-B)">
      <select id="presets">
        <option value="">-- presets --</option>
        <option>1</option>
        <option>22</option>
        <option>66</option>
        <option>Red</option>
        <option>Orange</option>
        <option>Blue</option>
        <option>Green-B</option>
        <option>Green-C</option>
        <option>Green-D</option>
        <option>Green-E</option>
        <option>Mattapan</option>
        <option>CR-Fitchburg</option>
      </select>

      <select id="refreshMs">
        <option value="5000">Refresh: 5s</option>
        <option value="10000" selected>Refresh: 10s</option>
        <option value="15000">Refresh: 15s</option>
        <option value="30000">Refresh: 30s</option>
      </select>

      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="fitBtn">Fit to Vehicles</button>
    </div>
  </header>

  <div id="map"></div>
  <div id="status">Idle.</div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="app.js"></script>
</body>
</html>
