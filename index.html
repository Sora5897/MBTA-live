<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBTA Live Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>MBTA Live Tracker</h1>
  <div id="app">
    <label for="apiKey">API Key (optional):</label>
    <input id="apiKey" type="text" placeholder="Enter MBTA API Key" />
    <button id="saveKey">Save Key</button>
    <br><br>
    <button id="fetchData">Fetch MBTA Vehicles</button>
    <pre id="output"></pre>
  </div>
  <script src="app.js"></script>
</body>
</html>
